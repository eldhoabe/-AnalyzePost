name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build and upload artifact, skip GitHub Release)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Resolve version
        id: version
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [[ "$TAG" != "$PKG_VERSION" ]]; then
              echo "ERROR: tag v$TAG does not match package.json version $PKG_VERSION"
              exit 1
            fi
          fi

      - name: Build release
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [[ -z "$API_BASE_URL" ]]; then
            echo "ERROR: repository variable API_BASE_URL is not set."
            exit 1
          fi
          npm run build

      - name: Check for secrets in build output
        run: |
          if grep -rE 'sk-|JEV_API_KEY|Bearer ' dist/; then
            echo "FAIL: secret pattern found in build output"
            exit 1
          fi
          echo "PASS: no secrets in build output"

      - name: Check no localhost in build output
        run: |
          if grep -r "localhost" dist/; then
            echo "FAIL: localhost URL found in release build"
            exit 1
          fi
          echo "PASS: no localhost in build output"

      - name: Package zip
        id: package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.pkg_version }}"
          ZIP_NAME="should-i-read-this-v${VERSION}.zip"
          cd dist && zip -r "../$ZIP_NAME" . && cd ..
          SHA256=$(sha256sum "$ZIP_NAME" | cut -d' ' -f1)
          echo "$SHA256  $ZIP_NAME" > "${ZIP_NAME%.zip}.sha256"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256_file=${ZIP_NAME%.zip}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (dry run or tag)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: |
            extension/${{ steps.package.outputs.zip_name }}
            extension/${{ steps.package.outputs.sha256_file }}

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            extension/${{ steps.package.outputs.zip_name }}
            extension/${{ steps.package.outputs.sha256_file }}
          generate_release_notes: true
          body_suffix: |

            ---
            📖 **[Install guide for testers](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md)**
